<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    {% seo %}

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}"
    >

    <!-- Dark theme overrides -->
    <style>
      :root {
        color-scheme: dark;
      }

      html {
        background-color: #0d1117;
      }

      body {
        background-color: #0d1117;
        color: #c9d1d9;
      }

      .markdown-body {
        color: #c9d1d9;
        background-color: #0d1117;
      }

      /*
       * Main Python Wheels heading
       */
      .site-title {
        margin-top: 0;
        margin-bottom: 24px;
        padding-bottom: 0.3em;
        border-bottom: 1px solid #30363d;
      }

      .site-title a {
        color: #58a6ff;
        text-decoration: none;
      }

      .site-title a:hover {
        color: #79c0ff;
        text-decoration: underline;
      }

      /*
       * Normal links
       */
      .markdown-body a {
        color: #58a6ff;
      }

      .markdown-body a:hover {
        color: #79c0ff;
      }

      /*
       * Headings
       */
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        color: #f0f6fc;
        border-color: #30363d;
      }

      /*
       * Wheel table
       */
      .markdown-body table {
        display: table;
        width: 100%;
        color: #c9d1d9;
        border-collapse: collapse;
      }

      .markdown-body table tr {
        background-color: #0d1117;
        border-top: 1px solid #30363d;
      }

      .markdown-body table tr:nth-child(2n) {
        background-color: #161b22;
      }

      .markdown-body table th,
      .markdown-body table td {
        padding: 10px 13px;
        border: 1px solid #30363d;
      }

      /*
       * Long wheel filenames can otherwise overflow on
       * phones or narrow browser windows.
       */
      .markdown-body table td:first-child {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      /*
       * Inline code
       */
      .markdown-body code,
      .markdown-body tt {
        color: #e6edf3;
        background-color: rgba(110, 118, 129, 0.4);
      }

      /*
       * Code blocks
       */
      .markdown-body pre {
        color: #e6edf3;
        background-color: #161b22;
      }

      .markdown-body pre code {
        background-color: transparent;
      }

      /*
       * Horizontal rules / blockquotes
       */
      .markdown-body hr {
        background-color: #30363d;
        border-color: #30363d;
      }

      .markdown-body blockquote {
        color: #8b949e;
        border-left-color: #30363d;
      }

      /*
       * Keep the page comfortable on large displays.
       */
      .container-lg {
        max-width: 1100px;
      }

      /*
       * Mobile table handling.
       */
      @media (max-width: 767px) {
        .markdown-body {
          padding-left: 4px;
          padding-right: 4px;
        }

        .markdown-body table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>

    {% include head-custom.html %}
  </head>

  <body>
    <main class="container-lg px-3 my-5 markdown-body">

<!--       <h3 class="site-title">
        <a href="{{ '/' | relative_url }}">Python Wheels</a>
      </h3> -->

      {{ content }}

    </main>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js"
      integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg="
      crossorigin="anonymous">
    </script>

    <script>
      anchors.add();
    </script>
  </body>
</html>
